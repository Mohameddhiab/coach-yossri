name: Keep Render Alive

on:
  schedule:
    - cron: '*/14 * * * *'  # toutes les 14 minutes (juste avant les 15 min de veille Render)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          URL="${{ secrets.RENDER_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            URL="https://ton-backend.onrender.com/api/health"
          fi
          echo "Pinging $URL ..."
          curl -s -o /dev/null -w "%{http_code} %{url_effective}\n" "$URL" || echo "ping failed"
          # fallback ping sur /api
          curl -s "https://ton-backend.onrender.com/api" || true
