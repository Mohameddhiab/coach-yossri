services:
  postgres:
    image: postgres:16-alpine
    container_name: 9awi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-9awi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-9awi_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-9awi}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-9awi} -d ${POSTGRES_DB:-9awi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: 9awi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: 9awi-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-9awi}:${POSTGRES_PASSWORD:-9awi_dev_pw}@postgres:5432/${POSTGRES_DB:-9awi}?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./web
    container_name: 9awi-web
    restart: unless-stopped
    environment:
      SERVER_API_URL: http://backend:3001/api
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

  mobile-web:
    build:
      context: ./mobile
      args:
        EXPO_PUBLIC_API_URL: http://localhost:3001/api
    container_name: 9awi-mobile-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata: