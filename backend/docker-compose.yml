services:
  postgres:
    image: postgres:16-alpine
    container_name: 9awi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: 9awi
      POSTGRES_PASSWORD: 9awi_dev_pw
      POSTGRES_DB: 9awi
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U 9awi -d 9awi']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: 9awi-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
